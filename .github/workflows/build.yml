name: Build VST3 for Windows

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Fetch JUCE
      run: |
        if (!(Test-Path -Path "JUCE/CMakeLists.txt")) {
          git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE
        }
      shell: powershell

    - name: Configure CMake
      run: cmake -B build

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstGain-Windows-VST3
        path: build/MyFirstGain_artefacts/Release/VST3/